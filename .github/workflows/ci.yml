name: ci

# Der Release-Workflow prüft dasselbe, aber erst beim Tag. Hier läuft es bei jedem Push,
# damit ein Fehler auffällt, solange er noch billig zu beheben ist.
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint with shellcheck
        run: shellcheck -x statusline.sh tests/run.sh tests/race.sh tests/forks.sh tests/snapshots.sh tests/freeze.sh tests/setup/*.sh

      - name: Run tests
        run: bash tests/run.sh

      - name: Run concurrency test
        run: bash tests/race.sh

      - name: Run process budget test
        run: bash tests/forks.sh

      - name: Run snapshot robustness test
        run: bash tests/snapshots.sh
